language: dafny

agenda:
  _target_: agenda.LocalAgenda
  language: dafny
  logger:
    _target_: logger.noop.NoOpLogger
  max_attempts: 1
  checkpoint_path: ${hydra:runtime.output_dir}/agenda.pkl
  checkpoint_interval: 1
  benchmark_codebase_time: null
  sort_every: 100

scheduler:
  _target_: scheduler.RoundRobinScheduler
  language: dafny
  turn_fuel: 1
  workers:
    - _target_: worker.initiator.Initiator
      language: dafny
      jsonl_path: data/repodisco-pilot-seed.jsonl
      doc_snippets_min: 0
      doc_snippets_max: 0
      distill: all
      llm:
        _target_: langchain_openai.ChatOpenAI
        model: gpt-5.6-luna
        reasoning_effort: low
        max_tokens: 4096
        timeout: 90
        max_retries: 0

hydra:
  run:
    dir: outputs/repodisco-pilot/${now:%Y%m%d-%H%M%S}
  job:
    chdir: false
